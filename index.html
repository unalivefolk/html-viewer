<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Content Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        surface: '#121214',
                        panel: '#18181b',
                        border: '#27272a',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar untuk editor/modal */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }

        /* Mode Fullscreen Murni: Menyembunyikan semua UI kecuali kontainer iframe */
        body.clean-fullscreen #top-bar,
        body.clean-fullscreen #empty-state,
        body.clean-fullscreen #paste-modal,
        body.clean-fullscreen #toast-container {
            display: none !important;
        }

        body.clean-fullscreen #player-wrapper {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            padding: 0 !important;
            margin: 0 !important;
            z-index: 9999 !important;
            background: #000 !important;
        }

        body.clean-fullscreen #content-frame {
            border-radius: 0 !important;
            border: none !important;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body class="bg-surface text-zinc-200 font-sans h-screen flex flex-col overflow-hidden select-none antialiased">

    <!-- Top Control Bar -->
    <header id="top-bar" class="h-14 border-b border-border bg-panel/80 backdrop-blur-md px-4 flex items-center justify-between shrink-0 z-20 transition-all">
        <!-- Brand / Status -->
        <div class="flex items-center gap-3 min-w-0">
            <div class="w-8 h-8 rounded-lg bg-zinc-800 border border-zinc-700/80 flex items-center justify-center text-emerald-400 shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
                </svg>
            </div>
            <div class="truncate">
                <h1 class="text-sm font-medium text-zinc-100 leading-none truncate">HTML Player</h1>
                <p id="file-status" class="text-xs text-zinc-500 mt-1 truncate">Belum ada konten dimuat</p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-2 shrink-0">
            <!-- Hidden File Input -->
            <input type="file" id="file-input" accept=".html,.htm,text/html" class="hidden">

            <!-- Import Button -->
            <button id="btn-import" title="Impor file .html" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-zinc-800/90 hover:bg-zinc-700/90 text-zinc-200 text-xs font-medium border border-zinc-700/60 transition-colors active:scale-95">
                <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                </svg>
                <span class="hidden sm:inline">Impor File</span>
            </button>

            <!-- Paste Button -->
            <button id="btn-paste" title="Tempel kode HTML" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-zinc-800/90 hover:bg-zinc-700/90 text-zinc-200 text-xs font-medium border border-zinc-700/60 transition-colors active:scale-95">
                <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                <span class="hidden sm:inline">Paste Kode</span>
            </button>

            <!-- Divider -->
            <div class="h-4 w-[1px] bg-border mx-1"></div>

            <!-- Clean Fullscreen Button -->
            <button id="btn-fullscreen" disabled title="Mode Layar Penuh Bersih (Tanpa UI)" class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 disabled:bg-zinc-800/50 disabled:text-zinc-600 disabled:border-zinc-800 text-white text-xs font-medium border border-emerald-500/50 transition-all active:scale-95 disabled:pointer-events-none">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
                </svg>
                <span>Fullscreen</span>
            </button>
        </div>
    </header>

    <!-- Main Player Area -->
    <main id="player-wrapper" class="flex-1 relative flex items-center justify-center p-3 sm:p-5 bg-surface overflow-hidden">
        
        <!-- Empty State / Drag & Drop Zone -->
        <div id="empty-state" class="w-full max-w-md border-2 border-dashed border-zinc-800 hover:border-zinc-700 rounded-2xl p-8 text-center transition-colors flex flex-col items-center justify-center bg-panel/30">
            <div class="w-12 h-12 rounded-xl bg-zinc-800/80 border border-zinc-700/50 flex items-center justify-center text-zinc-400 mb-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </div>
            <h2 class="text-sm font-medium text-zinc-200 mb-1">Siap Memutar Konten HTML</h2>
            <p class="text-xs text-zinc-500 leading-relaxed mb-6">
                Tarik & lepas file <code class="text-zinc-400">.html</code> ke area ini, gunakan tombol impor, atau tempel kode HTML secara langsung.
            </p>
            <div class="flex items-center gap-3 w-full">
                <button onclick="document.getElementById('file-input').click()" class="flex-1 py-2 px-3 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-zinc-200 border border-zinc-700/60 transition-colors">
                    Pilih File
                </button>
                <button onclick="openPasteModal()" class="flex-1 py-2 px-3 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-zinc-200 border border-zinc-700/60 transition-colors">
                    Tempel Kode
                </button>
            </div>
        </div>

        <!-- Sandboxed Iframe Container -->
        <iframe id="content-frame" class="hidden w-full h-full bg-white rounded-xl border border-border shadow-2xl" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-pointer-lock"></iframe>
    </main>

    <!-- Paste HTML Modal -->
    <div id="paste-modal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-panel border border-border rounded-2xl w-full max-w-2xl flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-150">
            <!-- Modal Header -->
            <div class="px-5 py-3.5 border-b border-border flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-sm font-medium text-zinc-100">Tempel Kode HTML</span>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btn-clipboard-paste" class="text-xs px-2.5 py-1 rounded-md bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 transition-colors">
                        Tempel dari Clipboard
                    </button>
                    <button id="btn-close-modal" class="p-1 text-zinc-400 hover:text-zinc-200 rounded-lg transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Textarea -->
            <div class="p-4 bg-surface">
                <textarea id="html-textarea" rows="12" placeholder="<!DOCTYPE html>&#10;<html>&#10;  <body>&#10;    <h1>Halo Dunia</h1>&#10;  </body>&#10;</html>" class="w-full bg-panel border border-border rounded-xl p-3.5 text-xs font-mono text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-zinc-600 resize-none leading-relaxed"></textarea>
            </div>

            <!-- Modal Footer -->
            <div class="px-5 py-3.5 border-t border-border bg-panel flex items-center justify-end gap-2.5">
                <button id="btn-cancel-modal" class="px-4 py-1.5 rounded-lg text-xs font-medium text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 transition-colors">
                    Batal
                </button>
                <button id="btn-run-pasted" class="px-4 py-1.5 rounded-lg text-xs font-medium bg-emerald-600 hover:bg-emerald-500 text-white transition-colors">
                    Jalankan Konten
                </button>
            </div>
        </div>
    </div>

    <!-- Minimal Toast Notification -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 pointer-events-none flex flex-col gap-2"></div>

    <script>
        // Referensi Elemen DOM
        const fileInput = document.getElementById('file-input');
        const btnImport = document.getElementById('btn-import');
        const btnPaste = document.getElementById('btn-paste');
        const btnFullscreen = document.getElementById('btn-fullscreen');
        const fileStatus = document.getElementById('file-status');
        
        const emptyState = document.getElementById('empty-state');
        const contentFrame = document.getElementById('content-frame');
        const playerWrapper = document.getElementById('player-wrapper');

        const pasteModal = document.getElementById('paste-modal');
        const htmlTextarea = document.getElementById('html-textarea');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const btnCancelModal = document.getElementById('btn-cancel-modal');
        const btnRunPasted = document.getElementById('btn-run-pasted');
        const btnClipboardPaste = document.getElementById('btn-clipboard-paste');

        let hasContent = false;

        /**
         * Menampilkan notifikasi toast singkat (hanya saat tidak fullscreen)
         */
        function showToast(message, isError = false) {
            if (document.body.classList.contains('clean-fullscreen')) return;

            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-3.5 py-2 rounded-lg text-xs font-medium shadow-lg border backdrop-blur-md transition-all duration-200 transform translate-y-2 opacity-0 ${
                isError 
                ? 'bg-red-950/90 border-red-800/60 text-red-200' 
                : 'bg-zinc-900/90 border-zinc-700/60 text-zinc-200'
            }`;
            toast.textContent = message;
            container.appendChild(toast);

            // Animasi masuk
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            // Hapus otomatis
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 200);
            }, 2800);
        }

        /**
         * Memuat string HTML ke dalam iframe sandbox
         */
        function renderHTMLContent(htmlString, sourceLabel) {
            if (!htmlString || !htmlString.trim()) {
                showToast('Konten HTML kosong.', true);
                return;
            }

            try {
                // Gunakan srcdoc untuk rendering cepat & terisolasi
                contentFrame.srcdoc = htmlString;
                
                // Update tampilan UI
                emptyState.classList.add('hidden');
                contentFrame.classList.remove('hidden');
                
                hasContent = true;
                btnFullscreen.disabled = false;
                fileStatus.textContent = sourceLabel;
                fileStatus.classList.replace('text-zinc-500', 'text-emerald-400');

                showToast(`Memutar: ${sourceLabel}`);
            } catch (err) {
                console.error('Gagal memuat konten:', err);
                showToast('Terjadi kesalahan saat memuat HTML.', true);
            }
        }

        /**
         * Membaca file lokal yang dipilih atau di-drop
         */
        function handleFileUpload(file) {
            if (!file) return;

            const isHtml = file.type === 'text/html' || file.name.endsWith('.html') || file.name.endsWith('.htm');
            if (!isHtml) {
                showToast('Harap pilih file berformat .html atau .htm', true);
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                renderHTMLContent(e.target.result, file.name);
            };
            reader.onerror = () => {
                showToast('Gagal membaca file.', true);
            };
            reader.readAsText(file);
        }

        // Event Listeners: Impor File
        btnImport.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileUpload(e.target.files[0]);
                fileInput.value = ''; // Reset agar file yang sama bisa dipilih ulang
            }
        });

        // Event Listeners: Drag & Drop pada seluruh area player
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            playerWrapper.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
            });
        });

        playerWrapper.addEventListener('dragover', () => {
            emptyState.classList.add('border-emerald-500/60', 'bg-zinc-800/40');
        });

        playerWrapper.addEventListener('dragleave', () => {
            emptyState.classList.remove('border-emerald-500/60', 'bg-zinc-800/40');
        });

        playerWrapper.addEventListener('drop', (e) => {
            emptyState.classList.remove('border-emerald-500/60', 'bg-zinc-800/40');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileUpload(files[0]);
            }
        });

        // Event Listeners: Modal Paste Kode
        function openPasteModal() {
            pasteModal.classList.remove('hidden');
            htmlTextarea.focus();
        }

        function closePasteModal() {
            pasteModal.classList.add('hidden');
        }

        btnPaste.addEventListener('click', openPasteModal);
        btnCloseModal.addEventListener('click', closePasteModal);
        btnCancelModal.addEventListener('click', closePasteModal);

        // Tutup modal saat klik area backdrop
        pasteModal.addEventListener('click', (e) => {
            if (e.target === pasteModal) closePasteModal();
        });

        // Baca dari clipboard jika diizinkan browser
        btnClipboardPaste.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    htmlTextarea.value = text;
                    showToast('Kode ditempel dari clipboard');
                }
            } catch (err) {
                htmlTextarea.focus();
                showToast('Gunakan Ctrl+V / Cmd+V di dalam kotak teks', true);
            }
        });

        // Jalankan kode dari textarea
        btnRunPasted.addEventListener('click', () => {
            const code = htmlTextarea.value;
            if (!code.trim()) {
                showToast('Masukkan kode HTML terlebih dahulu', true);
                return;
            }
            closePasteModal();
            renderHTMLContent(code, 'Kode HTML (Paste)');
        });

        /**
         * Fitur Clean Fullscreen (100% Bersih tanpa tombol melayang/overlay)
         */
        async function enterCleanFullscreen() {
            if (!hasContent) return;

            document.body.classList.add('clean-fullscreen');

            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    await document.documentElement.webkitRequestFullscreen();
                }
            } catch (err) {
                // Jika API Fullscreen diblokir oleh iframe host/browser,
                // CSS .clean-fullscreen tetap membuat tampilan 100% full-viewport tanpa tombol apa pun.
                console.warn('Fullscreen API fallback ke mode viewport penuh:', err);
            }
        }

        function exitCleanFullscreen() {
            document.body.classList.remove('clean-fullscreen');
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        btnFullscreen.addEventListener('click', enterCleanFullscreen);

        // Sinkronisasi saat pengguna keluar dari fullscreen lewat tombol sistem / ESC
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.body.classList.remove('clean-fullscreen');
            }
        });
        document.addEventListener('webkitfullscreenchange', () => {
            if (!document.webkitFullscreenElement) {
                document.body.classList.remove('clean-fullscreen');
            }
        });

        // Shortcut Keyboard: ESC untuk keluar dari mode clean-fullscreen jika berada dalam fallback viewport
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (!pasteModal.classList.contains('hidden')) {
                    closePasteModal();
                } else if (document.body.classList.contains('clean-fullscreen')) {
                    exitCleanFullscreen();
                }
            }
        });
    </script>
</body>
</html>
